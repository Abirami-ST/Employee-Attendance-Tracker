<div class="history-container" *ngIf="member">
  <h2>Attendance History - {{ member.name }}</h2>

  <table class="history-table">
    <thead>
      <tr>
        <th>Date</th>
        <th>Status</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let record of member.attendance">
        <td>{{ record.date }}</td>
        <td *ngIf="isTeamLead">
          <select [(ngModel)]="record.status">
            <option value="Present">Present</option>
            <option value="Absent">Absent</option>
            <option value="WFH">WFH</option>
            <option value="Leave">Leave</option>
          </select>
        </td>
        <td *ngIf="!isTeamLead">{{ record.status }}</td>
      </tr>
    </tbody>
  </table>

  <div class="history-buttons">
    <button *ngIf="isTeamLead" (click)="saveChanges()">Save Changes</button>
    <!-- <button (click)="goBack()" [disabled]="!isTeamLead" [ngStyle]="{ 'cursor': isTeamLead ? 'pointer' : 'not-allowed' }">Back</button> -->
    <button *ngIf="isTeamLead" (click)="goBack()" >Back</button>
  </div>
</div>

<div *ngIf="!member">
  <p>No member found.</p>
</div>
